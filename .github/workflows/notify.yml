name: Notify new prompts

on:
  push:
    branches: [main]
    paths:
      - prompts.json
  workflow_dispatch:
    inputs:
      force:
        description: "Type yes to send a test notification"
        required: false
        default: "no"

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet google-auth requests
          /tmp/venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account


          def load(rev):
              try:
                  text = subprocess.check_output(
                      ["git", "show", rev + ":prompts.json"], text=True
                  )
                  return json.loads(text)["prompts"]
              except Exception:
                  return None


          force = os.environ.get("FORCE", "") == "yes"
          new = load("HEAD")
          old = load("HEAD~1")

          added = []
          if new is not None and old is not None:
              old_ids = {p["id"] for p in old}
              added = [p for p in new if p["id"] not in old_ids]

          if not added and not force:
              print("No new prompts, so no notification was sent.")
              sys.exit(0)

          if added:
              if len(added) == 1:
                  title = "New prompt added"
                  body = added[0]["title"]
              else:
                  title = str(len(added)) + " new prompts added"
                  body = ", ".join(p["title"] for p in added[:3])
              print("New prompts:", [p["id"] for p in added])
              time.sleep(120)
          else:
              title = "Test notification"
              body = "Automatic notifications work"

          info = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          creds.refresh(Request())

          url = (
              "https://fcm.googleapis.com/v1/projects/"
              + info["project_id"]
              + "/messages:send"
          )
          message = {
              "message": {
                  "topic": "all",
                  "notification": {"title": title, "body": body},
              }
          }
          response = requests.post(
              url,
              headers={
                  "Authorization": "Bearer " + creds.token,
                  "Content-Type": "application/json",
              },
              json=message,
              timeout=30,
          )
          print(response.status_code, response.text)
          if response.status_code != 200:
              sys.exit(1)
          PY
